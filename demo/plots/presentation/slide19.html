<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agradecimiento y Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        .slide {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(0, 59, 92, 0.9), rgba(0, 128, 128, 0.8));
            color: white;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 2.5rem 4rem 1rem;
            text-align: center;
        }
        .title {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #8cffdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
        }
        .content {
            display: flex;
            flex: 1;
            padding: 1rem 4rem 2.5rem;
        }
        .contact-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 0 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .contact-card:hover {
            transform: translateY(-10px);
        }
        .photo-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            border: 3px solid rgba(76, 175, 80, 0.5);
        }
        .photo-placeholder i {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.7);
        }
        .name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #8cffdb;
        }
        .contact-info {
            width: 100%;
            margin-bottom: 1.5rem;
        }
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .contact-item:last-child {
            margin-bottom: 0;
        }
        .contact-icon {
            width: 36px;
            height: 36px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 1rem;
            flex-shrink: 0;
        }
        .contact-icon i {
            font-size: 1.5rem;
            color: #8cffdb;
        }
        .contact-text {
            font-size: 1.5rem;
            font-weight: 500;
        }
        .footer {
            text-align: center;
            padding: 1rem 4rem;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
    <script src="changeSlide.js"></script>
    <link rel="stylesheet" href="windowFix.css">
</head>
<body>
    <div class="slide">
        <div class="header">
            <h1 class="title">Agradecemos su tiempo e interés</h1>
            <p class="subtitle">Estamos disponibles para cualquier consulta o colaboración futura</p>
        </div>
        <div class="content">
            <div class="contact-card">
                <div class="photo-placeholder" style="position: relative; overflow: hidden;">
                    <i class="fas fa-user"></i>
                    <img src="foto-facu.png" alt="Facundo Ramírez" style="width: 150px; height: 150px; object-fit: cover; position: absolute; top: 0; left: 0; border-radius: 50%;">
                </div>
                <h2 class="name">Facundo Ramírez</h2>
                <div class="contact-info">
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="contact-text">facundomrb@gmail.com</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fab fa-github"></i>
                        </div>
                        <div class="contact-text">facumrb</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fas fa-phone"></i>
                        </div>
                        <div class="contact-text">+54 9 341 391 8478</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fab fa-instagram"></i>
                        </div>
                        <div class="contact-text">Instagram: facu_mrb</div>
                    </div>
                </div>
            </div>
            
            <div class="contact-card">
                <div class="photo-placeholder" style="position: relative; overflow: hidden;">
                    <i class="fas fa-user"></i>
                    <img src="foto_eneas.jpg" alt="Eneas Paratore" style="width: 150px; height: 150px; object-fit: cover; position: absolute; top: 0; left: 0; border-radius: 50%;">
                </div>
                <h2 class="name">Eneas Paratore</h2>
                <div class="contact-info">
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="contact-text">eneasparatore@gmail.com</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fab fa-github"></i>
                        </div>
                        <div class="contact-text">Eneasss</div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fas fa-phone"></i>
                        </div>
                        <div class="contact-text">+54 9 3462 57 6070</div>
                    </div>
                    <!--
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fab fa-instagram"></i>
                        </div>
                        <div class="contact-text">Instagram: eneas_falta_instagram</div>
                    </div>
                    -->
                </div>
            </div>
        </div>
        <!--
        <div class="footer">
            <p>Gracias por su atención</p>
        </div>
        -->
    </div>

</body></html>
