<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogma Central de la Biología Molecular</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        .slide {
            width: 100vw;              /* 100% del ancho visible */
            height: 100vh;             /* 100% del alto visible */
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(0, 59, 92, 0.9), rgba(0, 128, 128, 0.8));
            color: white;
            display: flex;
            flex-direction: column;
            }
        .header {
            padding: 2.5rem 4rem 1rem;
        }
        .title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #8cffdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .content {
            display: flex;
            flex: 1;
            padding: 0 4rem 2.5rem;
        }
        .left-content {
            flex: 1;
            padding-right: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .concept-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border-left: 4px solid #4caf50;
            transition: transform 0.3s ease;
        }
        .concept-card:hover {
            transform: translateX(5px);
        }
        .concept-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #8cffdb;
            display: flex;
            align-items: center;
        }
        .concept-title i {
            margin-right: 0.75rem;
            font-size: 1.5rem;
        }
        .concept-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .keyword {
            background: rgba(76, 175, 80, 0.2);
            color: #ffffff;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .image-container img {
            max-width: 90%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .key-point {
            background: linear-gradient(90deg, rgba(76, 175, 80, 0.3), rgba(140, 255, 219, 0.2));
            border-radius: 12px;
            padding: 1.25rem;
            margin-top: 1.5rem;
            border-left: 4px solid #4caf50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .key-point-text {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
        }
        .highlight {
            color: #8cffdb;
            font-weight: 700;
        }
        .flow-arrow {
            position: absolute;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #4caf50, transparent);
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            z-index: -1;
        }
    </style>
    <script src="changeSlide.js"></script>
    <link rel="stylesheet" href="windowFix.css">
</head>
<body>
    <div class="slide">
        <div class="header">
            <h1 class="title">Dogma Central de la Biología Molecular</h1>
        </div>
        <div class="content">
            <div class="left-content">
                <div class="concept-card">
                    <div class="concept-title">
                        <i class="fas fa-dna"></i>
                        ADN
                    </div>
                    <div class="concept-keywords">
                        <span class="keyword">Biblioteca genética</span>
                        <span class="keyword">Información hereditaria</span>
                        <span class="keyword">Núcleo celular</span>
                    </div>
                </div>
                
                <div class="concept-card">
                    <div class="concept-title">
                        <i class="fas fa-file-import"></i>
                        Transcripción
                    </div>
                    <div class="concept-keywords">
                        <span class="keyword">ADN → ARNm</span>
                        <span class="keyword">ARN polimerasa</span>
                        <span class="keyword">Copia de instrucciones</span>
                    </div>
                </div>
                
                <div class="concept-card">
                    <div class="concept-title">
                        <i class="fas fa-cogs"></i>
                        Traducción
                    </div>
                    <div class="concept-keywords">
                        <span class="keyword">ARNm → Proteínas</span>
                        <span class="keyword">Ribosomas</span>
                        <span class="keyword">Aminoácidos</span>
                    </div>
                </div>
                
                <div class="key-point">
                    <p class="key-point-text">Flujo unidirecional: <span class="highlight">ADN</span> → <span class="highlight">ARN</span> → <span class="highlight">Proteínas</span></p>
                </div>
            </div>
            
            <div class="right-content">
                <div class="image-container">
                    <div class="flow-arrow"></div>
                    <img src="https://sfile.chatglm.cn/images-ppt/4fe8eee84ab5.png" alt="Diagrama del Dogma Central de la Biología Molecular">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
